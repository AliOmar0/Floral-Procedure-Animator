kind = "web"
previewPath = "/"
title = "Procedural Flower Animation"
version = "1.0.0"
id = "artifacts/flower-animation"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20082

[services.development]
run = "pnpm --filter @workspace/flower-animation run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flower-animation", "run", "build" ]
publicDir = "artifacts/flower-animation/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20082"
BASE_PATH = "/"
